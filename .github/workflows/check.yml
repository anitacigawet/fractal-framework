name: Check Fractal Framework

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wizard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wizard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: wizard/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/notebooklm_bridge/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Install Python bridge dependencies
        run: python -m pip install -r ../engine/notebooklm_bridge/requirements.txt
      - name: Check Python bridge import and CLI
        working-directory: engine
        run: |
          python -c "import notebooklm_bridge; print(notebooklm_bridge.__version__)"
          python -m notebooklm_bridge.runner --help
          set +e
          python -m notebooklm_bridge.runner status --force
          status_code=$?
          set -e
          test "$status_code" -eq 1
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:showroom
      - name: Smoke-test production server
        run: |
          pnpm build
          pnpm start > "$RUNNER_TEMP/fractal-wizard.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7101/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/fractal-wizard.log"
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:7101/ | grep -q "Fractal Framework"
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT
      - run: pnpm audit --prod
